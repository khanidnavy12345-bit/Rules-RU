name: Build v2rayA rules

on:
  workflow_dispatch:
  schedule:
    - cron: "5 8,14,19,23 * * *"
  push:
    paths:
      - "rules/**"
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: v2raya-rules
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release artifacts
        run: python scripts/build.py

      - name: Commit release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release
          if git diff --cached --quiet; then
            echo "No release changes"
          else
            git commit -m "Update generated v2rayA rules"
            git push origin HEAD:${GITHUB_REF_NAME:-main}
          fi

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push origin latest --force
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --title "Latest v2rayA rules" \
              --notes "Generated from the latest selected RunetFreedom geosite and geoip data." \
              --latest
          else
            gh release create latest \
              --title "Latest v2rayA rules" \
              --notes "Generated from the latest selected RunetFreedom geosite and geoip data." \
              --latest
          fi
          gh release upload latest \
            release/geosite.dat \
            release/geoip.dat \
            release/v2raya-rules.txt \
            release/routing.happ \
            release/routing.happ.json \
            --clobber
